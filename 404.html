<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <title>Page not found — Stack PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/pdf-combiner/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="site-header">
        <a class="brand" href="/pdf-combiner/" aria-label="Stack PDF home">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>Stack PDF</span>
        </a>
      </header>

      <section class="workspace not-found" aria-labelledby="page-title">
        <p class="eyebrow">Error 404</p>
        <h1 id="page-title">That page is not in this stack.</h1>
        <p>The link may be outdated, or the page may have moved.</p>
        <a class="button button-primary" href="/pdf-combiner/">Go to Stack PDF</a>
      </section>
    </main>
  </body>
</html>
